name: Bug report
description: Something in Chesswiz does not work as expected
labels: [bug]
body:
  - type: input
    id: version
    attributes: {label: Chesswiz version, description: "Help > About Chesswiz"}
    validations: {required: true}
  - type: dropdown
    id: os
    attributes: {label: Operating system, options: [Windows, macOS, Linux]}
    validations: {required: true}
  - type: textarea
    id: steps
    attributes: {label: Steps to reproduce, placeholder: "1. Open ...\n2. Click ...\n3. ..."}
    validations: {required: true}
  - type: textarea
    id: expected
    attributes: {label: What happened, and what you expected}
    validations: {required: true}
  - type: textarea
    id: log
    attributes: {label: Log or screenshot, description: "Help > Show Log (Ctrl+L). Remove anything private.", render: text}
